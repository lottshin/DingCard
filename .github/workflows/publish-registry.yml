name: Publish to the MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read

# Run by hand once the staged dingcard-mcp release is approved on npm
# (`gh workflow run publish-registry.yml`): the registry reads mcpName from the
# package npm serves and refuses a version that is not public yet. It logs in
# with GitHub OIDC, which proves the io.github.lottshin namespace; no token is
# stored anywhere.
jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check server.json against the package and npm
        shell: bash
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./mcp/server.json').name")"
          VERSION="$(node -p "require('./mcp/server.json').version")"
          if [[ "$(node -p "require('./mcp/package.json').version")" != "$VERSION" ]]; then
            echo "mcp/server.json $VERSION does not match mcp/package.json" >&2
            exit 1
          fi
          PUBLISHED="$(npm view "dingcard-mcp@$VERSION" mcpName 2>/dev/null || true)"
          if [[ "$PUBLISHED" != "$NAME" ]]; then
            echo "npm does not serve dingcard-mcp@$VERSION with mcpName $NAME (got '$PUBLISHED'); approve the staged release first" >&2
            exit 1
          fi
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        shell: bash
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - run: ./mcp-publisher login github-oidc
      - name: Publish mcp/server.json
        working-directory: mcp
        run: ../mcp-publisher publish
