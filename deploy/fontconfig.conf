<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Installed as /etc/fonts/local.conf in the image and on CI's render step.
  Templates set their words in PingFang SC, which only Apple systems have;
  without it Chrome falls back font by font and the cards are measured and
  drawn in other fonts than they were laid out in. Noto Sans CJK SC
  (fonts-noto-cjk) is the design of the Noto Sans SC web font the pages load.
-->
<fontconfig>
  <alias binding="same">
    <family>PingFang SC</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
</fontconfig>
