<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="叮卡">
  <title>叮卡</title>
  <defs>
    <linearGradient id="fav-base" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="fav-amber" x1="20" y1="12" x2="48" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- 圆形基底更适合浏览器标签页 -->
  <circle cx="32" cy="32" r="32" fill="url(#fav-base)"/>
  <circle cx="32" cy="32" r="31" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- 负空间几何切片字标 "D" -->
  <g transform="translate(2, 0)">
    <!-- 左侧卡片主轴 (Spine) -->
    <rect x="15" y="14" width="7" height="36" rx="3.5" fill="#f4f4f5"/>

    <!-- 右侧上半切片 (Amber Slice) -->
    <path d="M26 14H35C42.732 14 49 20.268 49 28C49 29.5 48.7 30.9 48.1 32.2L36.5 20.6C35.7 19.8 34.6 19.3 33.4 19.3H26V14Z" fill="url(#fav-amber)"/>

    <!-- 右侧下半切片 (Light Slice) -->
    <path d="M26 26.5L43.5 44H35C30.0294 44 26 39.9706 26 35V26.5Z" fill="#f4f4f5" fill-opacity="0.95"/>

    <!-- 裁切缝微光核心 (Spark) -->
    <circle cx="37" cy="27" r="2.5" fill="#ffffff"/>
  </g>
</svg>
